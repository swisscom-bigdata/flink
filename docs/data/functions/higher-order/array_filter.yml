name: ARRAY_FILTER
summary: Returns the elements of an array for which a lambda returns TRUE.

syntax:
  sql: ARRAY_FILTER(arr, x -> condition)
  java: $("arr").arrayFilter(x -> condition)
  python: |
    col("arr").array_filter(lambda x: condition)

arguments:
  - name: arr
    type: ARRAY of any type
    required: true
    description: The array to filter.
  - name: x -> condition
    type: Lambda with one parameter that returns BOOLEAN
    required: true
    description: Called once for each element, with the element as `x`. The element is kept if the lambda returns TRUE.

returns:
  description: The elements of `arr` for which the lambda returns TRUE, in their original order.
  nulls: Returns NULL if `arr` is NULL. An empty array returns an empty array.
  type: The type of `arr`.

notes:
  - An element for which the lambda returns FALSE or NULL is left out.
  - A NULL element is passed to the lambda like any other element.
  - The lambda can use the columns of the query and the parameters of enclosing lambdas. See [Higher-Order Functions]({{< ref "docs/sql/built-in-functions/higher-order" >}}) for what a lambda can use.

see_also:
  - {name: ARRAY_TRANSFORM, ref: higher-order/array-transform}
  - {name: ARRAY_REDUCE, ref: higher-order/array-reduce}
  - {name: ARRAY_ZIP_WITH, ref: higher-order/array-zip-with}

examples:
  - title: Keep the elements that match
    description: Keep the elements that are greater than 1.
    sql: |
      SELECT arr, ARRAY_FILTER(arr, x -> x > 1) AS `ARRAY_FILTER(arr, x -> x > 1)`
      FROM (VALUES (ARRAY[1, 2, 3]), (ARRAY[0, 1])) AS t(arr);
    result: |
      | arr       | ARRAY_FILTER(arr, x -> x > 1) |
      |-----------|-------------------------------|
      | [1, 2, 3] | [2, 3]                        |
      | [0, 1]    | []                            |

  - title: Compare with a column of the query
    description: Keep the readings above the `threshold` of the same row.
    sql: |
      SELECT readings, threshold,
        ARRAY_FILTER(readings, r -> r > threshold) AS `ARRAY_FILTER(readings, r -> r > threshold)`
      FROM (VALUES (ARRAY[12, 48, 31], 30), (ARRAY[5, 7], 10)) AS t(readings, threshold);
    result: |
      | readings     | threshold | ARRAY_FILTER(readings, r -> r > threshold) |
      |--------------|-----------|--------------------------------------------|
      | [12, 48, 31] | 30        | [48, 31]                                   |
      | [5, 7]       | 10        | []                                         |

  - title: Filter strings
    description: Keep the tags that start with `flink`.
    sql: |
      SELECT tags, ARRAY_FILTER(tags, tag -> tag LIKE 'flink%') AS `ARRAY_FILTER(tags, tag -> tag LIKE 'flink%')`
      FROM (VALUES (ARRAY['flink-sql', 'kafka', 'flink-cdc'])) AS t(tags);
    result: |
      | tags                          | ARRAY_FILTER(tags, tag -> tag LIKE 'flink%') |
      |-------------------------------|----------------------------------------------|
      | [flink-sql, kafka, flink-cdc] | [flink-sql, flink-cdc]                       |

  - title: NULL elements
    description: "`NULL > 1` is NULL, so the NULL element is left out. `x IS NOT NULL` removes the NULL elements."
    sql: |
      SELECT arr,
        ARRAY_FILTER(arr, x -> x > 1) AS `ARRAY_FILTER(arr, x -> x > 1)`,
        ARRAY_FILTER(arr, x -> x IS NOT NULL) AS `ARRAY_FILTER(arr, x -> x IS NOT NULL)`
      FROM (VALUES (ARRAY[1, CAST(NULL AS INT), 3])) AS t(arr);
    result: |
      | arr          | ARRAY_FILTER(arr, x -> x > 1) | ARRAY_FILTER(arr, x -> x IS NOT NULL) |
      |--------------|-------------------------------|---------------------------------------|
      | [1, NULL, 3] | [3]                           | [1, 3]                                |

  - title: Empty and NULL arrays
    description: An empty array returns an empty array, and a NULL array returns NULL.
    sql: |
      SELECT arr, ARRAY_FILTER(arr, x -> x > 1) AS `ARRAY_FILTER(arr, x -> x > 1)`
      FROM (VALUES (ARRAY_REMOVE(ARRAY[1], 1)), (CAST(NULL AS ARRAY<INT>))) AS t(arr);
    result: |
      | arr  | ARRAY_FILTER(arr, x -> x > 1) |
      |------|-------------------------------|
      | []   | []                            |
      | NULL | NULL                          |
